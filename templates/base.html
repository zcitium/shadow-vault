<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowVault</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <a href="{% url 'home' %}" class="logo">SHADOW<span class="highlight">VAULT</span></a>
        </header>
        <main>
            <!-- Modal Popup -->
            <div id="messageModal" class="modal">
                <div class="modal-content">
                    <span class="close-btn">&times;</span>
                    <p id="modalMessage"></p>
                </div>
            </div>

            {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    const modal = document.getElementById("messageModal");
                    const modalMessage = document.getElementById("modalMessage");

                    {% for message in messages %}
                    modalMessage.textContent = "{{ message }}";
                    modal.style.display = "block";
                    // Only show first message to avoid stacking
                    {% endfor %}

                    document.querySelector('.close-btn').addEventListener('click', function () {
                        modal.style.display = "none";
                    });

                    window.addEventListener('click', function (event) {
                        if (event.target == modal) {
                            modal.style.display = "none";
                        }
                    });
                });
            </script>
            {% endif %}
            {% block content %}
            {% endblock %}
        </main>
        <footer>
            <p>&copy; 2025 ShadowVault. Secure. Hidden. Elegant.</p>
        </footer>
    </div>
</body>

</html>
