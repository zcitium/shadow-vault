<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShadowVault | Secure Steganography & Image Encryption</title>
    <meta name="description"
        content="Hide secret messages in images securely. ShadowVault offers free, client-side AES encoded steganography to protect your privacy.">
    <meta name="keywords"
        content="steganography, hide text in image, image encryption, secret message, AES encryption, cyber security, privacy tool, online steganography, shadow vault">
    <meta name="author" content="ShadowVault">
    <meta name="robots" content="index, follow">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://yourshadowvault.vercel.app/">
    <meta property="og:title" content="ShadowVault | Secure Steganography">
    <meta property="og:description"
        content="Hide secrets in plain sight. Free, secure, and instant image steganography tool.">
    <meta property="og:image" content="https://yourshadowvault.vercel.app/static/images/favicon.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="ShadowVault | Secure Steganography">
    <meta property="twitter:description"
        content="Hide secrets in plain sight. Free, secure, and instant image steganography tool.">
    <meta property="twitter:image" content="https://yourshadowvault.vercel.app/static/images/favicon.png">
    {% load static %}
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;700&family=Nunito:wght@400;600;800&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="background-animation"></div>
    <div class="container">
        <header>
            <a href="{% url 'home' %}" class="logo">SHADOW<span class="highlight">VAULT</span></a>
        </header>
        <main>
            <!-- Modal Popup -->
            <div id="messageModal" class="modal">
                <div class="modal-content">
                    <span class="close-btn">&times;</span>
                    <p id="modalMessage"></p>
                </div>
            </div>

            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    const modal = document.getElementById("messageModal");
                    const modalMessage = document.getElementById("modalMessage");
                    const closeBtn = document.querySelector('.close-btn');

                    if (closeBtn) {
                        closeBtn.addEventListener('click', function () {
                            modal.style.display = "none";
                        });
                    }

                    window.addEventListener('click', function (event) {
                        if (event.target == modal) {
                            modal.style.display = "none";
                        }
                    });

                    {% if messages %}
                    {% for message in messages %}
                    modalMessage.textContent = "{{ message|escapejs }}";
                    modal.style.display = "block";
                    {% endfor %}
                    {% endif %}
                });
            </script>
            {% block content %}
            {% endblock %}
        </main>
        <footer>
            <p>&copy; 2025 ShadowVault. Secure. Hidden. Elegant.</p>
        </footer>
    </div>
</body>

</html>
