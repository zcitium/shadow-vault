{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>ENCODE MESSAGE</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="error-message" style="color: #ff80ab; font-size: 0.9em; margin-top: 5px;">
                {% for error in field.errors %}
                <p>{{ error }}</p>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Encrypt & Download</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.querySelector('input[type="file"]');
        const MAX_SIZE_MB = 2; // Strict 2MB Limit
        const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;

        // Modal references (We'll assume you have a generic modal structure in base.html)
        const modal = document.getElementById("messageModal");
        const modalMsg = document.getElementById("modalMessage");
        const closeBtn = document.querySelector(".close-btn");

        function showCustomAlert(message) {
            modalMsg.textContent = message;
            modal.style.display = "block";
        }

        // Create a custom Confirm Modal dynamically or use existing structure
        const confirmModalHTML = `
            <div id="confirmModal" class="modal">
                <div class="modal-content">
                    <p id="confirmMessage"></p>
                    <div style="margin-top:20px;">
                        <button id="confirmYes" class="btn">Yes, Compress</button>
                        <button id="confirmNo" class="btn btn-secondary">No, Cancel</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', confirmModalHTML);

        const confirmModal = document.getElementById("confirmModal");
        const confirmMsg = document.getElementById("confirmMessage");
        const btnYes = document.getElementById("confirmYes");
        const btnNo = document.getElementById("confirmNo");

        function showCustomConfirm(message, callback) {
            confirmMsg.textContent = message;
            confirmModal.style.display = "block";

            btnYes.onclick = function () {
                confirmModal.style.display = "none";
                callback(true);
            };

            btnNo.onclick = function () {
                confirmModal.style.display = "none";
                fileInput.value = ''; // Clear input if no
                callback(false);
            };
        }

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg'];
            if (!allowedTypes.includes(file.type)) {
                showCustomAlert("Error: Only JPG and PNG files are allowed.");
                fileInput.value = ''; // Clear input
                return;
            }

            if (file.size > MAX_SIZE_BYTES) {
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const msg = `Image size is ${fileSizeMB}MB (Max ${MAX_SIZE_MB}MB).\n\nIt's too big! Should I compress it for you?`;

                showCustomConfirm(msg, function (result) {
                    if (result) {
                        compressImage(file);
                    }
                });
            }
        });

        // Progress Overlay Logic
        const progressOverlayHTML = `
            <div id="progressOverlay" class="progress-overlay" style="display: none;">
                <div class="spinner"></div>
                <div class="progress-text">ENCRYPTING...</div>
                <p style="color: #b39ddb; margin-top: 10px;">Please wait, this may take a moment.</p>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', progressOverlayHTML);
        const progressOverlay = document.getElementById("progressOverlay");
        const form = document.querySelector('form');

        form.addEventListener('submit', function (e) {
            e.preventDefault(); // Stop standard submission

            if (fileInput.files.length === 0) {
                // Should be caught by required attribute, but just in case
                return;
            }

            // Show Spinner
            progressOverlay.style.display = 'flex';

            const formData = new FormData(form);

            fetch(form.action || window.location.href, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(response => {
                    const contentType = response.headers.get("content-type");

                    if (contentType && contentType.includes("image/png")) {
                        // It's a file! Download it.
                        return response.blob().then(blob => {
                            const url = window.URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.style.display = 'none';
                            a.href = url;
                            // Use filename from header if possible, or default
                            a.download = 'encoded_image.png';
                            document.body.appendChild(a);
                            a.click();
                            window.URL.revokeObjectURL(url);

                            // Hide Spinner immediately after download starts
                            progressOverlay.style.display = 'none';

                            // Optional: Show success message/modal?
                            showCustomAlert("Encryption Complete! Image downloaded.");
                        });
                    } else {
                        // It's HTML (Error page)
                        return response.text().then(html => {
                            // Replace the current page content with the error page
                            document.open();
                            document.write(html);
                            document.close();
                            // Spinner disappears because page content is replaced/reloaded
                        });
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    progressOverlay.style.display = 'none';
                    showCustomAlert("An unexpected error occurred. Please try again.");
                });
        });

        function compressImage(file) {
            // Show loader during compression too? Maybe just for final submit.
            // keeping it simple for now.
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Aggressive Resizing: Max Dimension 1200px
                    const MAX_DIMENSION = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                        if (width > height) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        } else {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    } else {
                        // Even small images get a slight squeeze to strip bloat
                        width *= 0.9;
                        height *= 0.9;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(function (blob) {
                        const newFile = new File([blob], file.name, {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(newFile);
                        fileInput.files = dataTransfer.files;

                        showCustomAlert(`Resized & Optimized! New size: ${(newFile.size / (1024 * 1024)).toFixed(2)}MB`);

                    }, 'image/jpeg', 0.8);
                };
            };
        }
    });
</script>
{% endblock %}
