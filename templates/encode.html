{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>ENCODE MESSAGE</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <div class="error-message" style="color: #ff80ab; font-size: 0.9em; margin-top: 5px;">
                {% for error in field.errors %}
                <p>{{ error }}</p>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Encrypt & Download</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.querySelector('input[type="file"]');
        const MAX_SIZE_MB = 2; // Strict 2MB Limit
        const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;

        // Modal references (We'll assume you have a generic modal structure in base.html)
        const modal = document.getElementById("messageModal");
        const modalMsg = document.getElementById("modalMessage");
        const closeBtn = document.querySelector(".close-btn");

        function showCustomAlert(message) {
            modalMsg.textContent = message;
            modal.style.display = "block";
        }

        // Create a custom Confirm Modal dynamically or use existing structure
        const confirmModalHTML = `
            <div id="confirmModal" class="modal">
                <div class="modal-content">
                    <p id="confirmMessage"></p>
                    <div style="margin-top:20px;">
                        <button id="confirmYes" class="btn">Yes, Compress</button>
                        <button id="confirmNo" class="btn btn-secondary">No, Cancel</button>
                    </div>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', confirmModalHTML);

        const confirmModal = document.getElementById("confirmModal");
        const confirmMsg = document.getElementById("confirmMessage");
        const btnYes = document.getElementById("confirmYes");
        const btnNo = document.getElementById("confirmNo");

        function showCustomConfirm(message, callback) {
            confirmMsg.textContent = message;
            confirmModal.style.display = "block";

            btnYes.onclick = function () {
                confirmModal.style.display = "none";
                callback(true);
            };

            btnNo.onclick = function () {
                confirmModal.style.display = "none";
                fileInput.value = ''; // Clear input if no
                callback(false);
            };
        }

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg'];
            if (!allowedTypes.includes(file.type)) {
                showCustomAlert("Error: Only JPG and PNG files are allowed.");
                fileInput.value = ''; // Clear input
                return;
            }

            if (file.size > MAX_SIZE_BYTES) {
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const msg = `Image size is ${fileSizeMB}MB (Max ${MAX_SIZE_MB}MB).\n\nIt's too big! Should I compress it for you?`;

                showCustomConfirm(msg, function (result) {
                    if (result) {
                        compressImage(file);
                    }
                });
            }
        });

        function compressImage(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Aggressive Resizing: Max Dimension 1200px
                    const MAX_DIMENSION = 1200;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
                        if (width > height) {
                            height *= MAX_DIMENSION / width;
                            width = MAX_DIMENSION;
                        } else {
                            width *= MAX_DIMENSION / height;
                            height = MAX_DIMENSION;
                        }
                    } else {
                        // Even small images get a slight squeeze to strip bloat
                        width *= 0.9;
                        height *= 0.9;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(function (blob) {
                        const newFile = new File([blob], file.name, {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(newFile);
                        fileInput.files = dataTransfer.files;

                        showCustomAlert(`Resized & Optimized! New size: ${(newFile.size / (1024 * 1024)).toFixed(2)}MB`);

                    }, 'image/jpeg', 0.8);
                };
            };
        }
    });
</script>
{% endblock %}
