{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>ENCODE MESSAGE</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn">Encrypt & Download</button>
    </form>
    <div style="text-align: center; margin-top: 20px;">
        <a href="{% url 'home' %}" class="btn btn-secondary">Back</a>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fileInput = document.querySelector('input[type="file"]');
        const MAX_SIZE_MB = 3;
        const MAX_SIZE_BYTES = MAX_SIZE_MB * 1024 * 1024;

        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;

            if (file.size > MAX_SIZE_BYTES) {
                const fileSizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const shouldCompress = confirm(`Image size is ${fileSizeMB}MB (Max ${MAX_SIZE_MB}MB).\n\nThis file is too large for the encryption process.\n\nClick OK to automatically compress it before uploading.\nClick Cancel to stop.`);

                if (shouldCompress) {
                    compressImage(file);
                } else {
                    alert("Image cannot be encrypted as file size is too large.");
                    fileInput.value = ''; // Clear input
                }
            }
        });

        function compressImage(file) {
            // Show toast or loading indicator using native toast logic if available, else alert
            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function (event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Scale down by 50% for compression
                    const width = img.width * 0.7;
                    const height = img.height * 0.7;

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    canvas.toBlob(function (blob) {
                        const newFile = new File([blob], file.name, {
                            type: 'image/jpeg',
                            lastModified: Date.now()
                        });

                        // Replace file in input
                        const dataTransfer = new DataTransfer();
                        dataTransfer.items.add(newFile);
                        fileInput.files = dataTransfer.files;

                        alert(`Image compressed! New size: ${(newFile.size / (1024 * 1024)).toFixed(2)}MB`);

                    }, 'image/jpeg', 0.7); // 70% quality JPEG
                };
            };
        }
    });
</script>
{% endblock %}
